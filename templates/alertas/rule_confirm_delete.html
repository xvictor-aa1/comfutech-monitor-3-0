{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="bi bi-exclamation-triangle"></i> Eliminar regla</h4>
            </div>
            <div class="card-body">
                <p>¿Eliminar definitivamente la regla <strong>{{ rule.name }}</strong>?</p>
                <p class="text-muted">Se eliminarán también sus alertas asociadas.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'alertas:rule_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
